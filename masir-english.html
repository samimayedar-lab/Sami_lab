<title>مسیر انگلیسی</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap">
<style>
/* Layout: the user's "Masir" look — dark glass on a violet/navy gradient with soft blobs, emoji tab bar. Five tabs: Today, Plan, Words, Journal, Progress. Bottom sheets for each activity. */
:root{
  --bg1:#1B1038; --bg2:#0E2A55; --bg3:#0B1B3A; --tx:#ffffff; --mu:rgba(255,255,255,.68);
  --g1:rgba(255,255,255,.16); --g2:rgba(255,255,255,.05); --bd:rgba(255,255,255,.22); --in:rgba(255,255,255,.10);
  --ac:#8E7CFF; --ac2:#00D4C8; --ok:#5CFFB0; --bad:#FF6B8B; --warn:#FFC857; --sheet:#1B1F3B; --blob:.5; --btn-tx:#ffffff;
  --font:"Vazirmatn",Tahoma,system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg1:#EEF0FF; --bg2:#E2F6F4; --bg3:#FCEBF3; --tx:#1B1F3B; --mu:rgba(27,31,59,.64);
  --g1:rgba(255,255,255,.88); --g2:rgba(255,255,255,.58); --bd:rgba(27,31,59,.13); --in:rgba(27,31,59,.06);
  --ac:#6A55F0; --ac2:#00A79D; --ok:#0E9F6E; --bad:#E11D48; --warn:#B7791F; --sheet:#ffffff; --blob:.3; color-scheme:light}}
:root[data-theme="light"]{
  --bg1:#EEF0FF; --bg2:#E2F6F4; --bg3:#FCEBF3; --tx:#1B1F3B; --mu:rgba(27,31,59,.64);
  --g1:rgba(255,255,255,.88); --g2:rgba(255,255,255,.58); --bd:rgba(27,31,59,.13); --in:rgba(27,31,59,.06);
  --ac:#6A55F0; --ac2:#00A79D; --ok:#0E9F6E; --bad:#E11D48; --warn:#B7791F; --sheet:#ffffff; --blob:.3; color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;font-family:var(--font);color:var(--tx);background-color:var(--bg1);background-image:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));background-attachment:fixed;line-height:1.75;font-size:15px;min-height:100%}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:var(--blob);z-index:0;pointer-events:none}
.b1{width:280px;height:280px;background:#8E7CFF;top:-80px;right:-60px}.b2{width:260px;height:260px;background:#00D4C8;top:45%;left:-90px}.b3{width:300px;height:300px;background:#FF6FB5;bottom:-110px;right:-60px}
#wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding-block:10px calc(110px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#top{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 10px;gap:8px}
#top b{font-size:21px;font-weight:800;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.icon-btn{font:inherit;background:var(--in);border:1px solid var(--bd);color:var(--tx);border-radius:14px;width:40px;height:40px;cursor:pointer;font-size:18px;display:grid;place-items:center}
.glass{background:linear-gradient(135deg,var(--g1),var(--g2));border:1px solid var(--bd);border-radius:22px;padding:14px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 8px 30px rgba(0,0,0,.16);margin-bottom:12px}
h1{font-size:24px;margin:0 0 4px;line-height:1.35;text-wrap:balance}
h2{font-size:18px;margin:0;text-wrap:balance}
h3{font-size:15.5px;margin:0 0 6px}
p{margin:0}
.mu{color:var(--mu)} .sm{font-size:12.5px} .c{text-align:center}
.en{direction:ltr;unicode-bidi:isolate}
.ltr{direction:ltr;text-align:left}
.sec{display:flex;align-items:center;justify-content:space-between;margin:16px 4px 8px;gap:8px}
.sec h2{font-size:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:380px){.grid4{grid-template-columns:repeat(2,1fr)}}
.tile{text-align:center;padding:10px 6px;margin:0}
.tile b{display:block;font-size:22px;font-weight:800;line-height:1.3}
.tile span{font-size:11.5px;color:var(--mu)}
.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:10px 16px;cursor:pointer;color:var(--btn-tx);background:linear-gradient(90deg,var(--ac),var(--ac2));box-shadow:0 6px 18px rgba(142,124,255,.28)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sec2{background:var(--in);color:var(--tx);border:1px solid var(--bd);box-shadow:none;font-weight:600}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:12px}
.btn.danger{background:var(--in);color:var(--bad);border:1px solid var(--bd);box-shadow:none}
.btn.wide{width:100%}
:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;width:100%}
textarea{min-height:110px;resize:vertical;line-height:1.8}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mu);margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 10px;border-radius:99px;background:var(--in);border:1px solid var(--bd);color:var(--tx);white-space:nowrap}
.chip.ok{color:var(--ok)} .chip.ac{color:var(--ac2)} .chip.warn{color:var(--warn)} .chip.bad{color:var(--bad)}
.bar{height:10px;border-radius:99px;background:var(--in);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .5s}
.hero{display:flex;align-items:center;gap:14px}
.hero .ring{flex:0 0 92px;width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{stroke:var(--in)} .ring .ar{stroke:url(#gr);transition:stroke-dashoffset .6s}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:800;font-size:20px;line-height:1.1}
.ring .v small{display:block;font-size:10.5px;font-weight:500;color:var(--mu)}
.hero .txt{min-width:0;flex:1}
.notice{display:flex;gap:10px;align-items:flex-start}
.notice .dot{flex:0 0 10px;height:10px;border-radius:50%;background:var(--warn);margin-top:8px;box-shadow:0 0 0 0 var(--warn);animation:pulse 1.8s infinite}
.notice.ok .dot{background:var(--ok);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}}

/* tasks */
.task{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;padding:12px}
.task .ic{flex:0 0 44px;height:44px;border-radius:14px;background:var(--in);display:grid;place-items:center;font-size:22px}
.task .body{flex:1;min-width:0}
.task .body b{display:block;font-size:15px}
.task .body p{font-size:13px;color:var(--mu);line-height:1.7}
.task .prompt{margin-top:6px;font-size:13px;padding:6px 10px;border-radius:10px;background:var(--in);direction:ltr;text-align:left}
.task .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.task.done{border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.task.done .body b{text-decoration:line-through;text-decoration-color:var(--ok)}
.tick{appearance:none;flex:0 0 30px;width:30px;height:30px;margin:6px 0 0;border-radius:10px;border:2px solid var(--ac2);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.tick:checked{background:var(--ok);border-color:var(--ok)}
.tick:checked::after{content:"";width:8px;height:14px;border:solid #0b1b3a;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tick:disabled{cursor:default}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 4px 8px}

/* plan */
.phase-h{margin:18px 4px 8px}
.dayrow{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;width:100%;font:inherit;color:inherit;text-align:right}
.dayrow .n{flex:0 0 42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:800;background:var(--in)}
.dayrow.full .n{background:var(--ok);color:#0b1b3a}
.dayrow.today{outline:2px solid var(--warn);outline-offset:-2px}
.dayrow.future{opacity:.55}
.dayrow .m{flex:1;min-width:0}
.dayrow .m b{display:block;font-size:14px}
.dayrow .m span{font-size:12px;color:var(--mu)}
.dayrow .pp{flex:0 0 64px}

/* words / review */
.wl{display:flex;flex-direction:column;gap:8px}
.wi{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 12px;margin:0}
.wi .m{min-width:0;flex:1}
.wi .w{font-weight:800;direction:ltr;text-align:right;overflow-wrap:anywhere}
.wi .t{font-size:13px;color:var(--mu);overflow-wrap:anywhere}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.seg button{font:inherit;font-size:12.5px;border:1px solid var(--bd);background:var(--in);color:var(--mu);border-radius:99px;padding:3px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;border-color:transparent}
.flash{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;cursor:pointer;padding:24px 16px}
.flash .front{font-size:32px;font-weight:800;direction:ltr;overflow-wrap:anywhere;line-height:1.3}
.flash .back{font-size:20px;font-weight:700;color:var(--ac2)}
.flash .ex{direction:ltr;font-style:italic;color:var(--mu);max-width:34ch}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grade{font:inherit;border-radius:14px;border:1px solid var(--bd);background:var(--in);color:var(--tx);padding:10px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:0}
.grade b{font-size:14px} .grade span{font-size:11px;color:var(--mu)}
.grade.g1 b{color:var(--bad)} .grade.g2 b{color:var(--warn)} .grade.g3 b{color:var(--ok)} .grade.g4 b{color:var(--ac2)}
.timerbox{display:flex;align-items:center;justify-content:space-between;gap:10px}
.clock{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;direction:ltr}

/* journal */
.entry{margin-bottom:10px}
.entry .eh{display:flex;gap:10px;align-items:flex-start}
.entry .eh .ic{flex:0 0 40px;height:40px;border-radius:12px;background:var(--in);display:grid;place-items:center;font-size:20px}
.entry .eh .m{flex:1;min-width:0}
.entry .eh b{display:block;overflow-wrap:anywhere}
.entry details{margin-top:8px}
.entry summary{cursor:pointer;color:var(--ac2);font-size:13px;font-weight:700}
.box{background:var(--in);border-radius:12px;padding:10px 12px;margin-top:8px;overflow-wrap:anywhere;white-space:pre-wrap}
.box.ltr{direction:ltr;text-align:left}
.fix{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:12px;background:var(--in);margin-top:6px}
.fix .o{direction:ltr;text-align:left;color:var(--bad);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--bad) 60%,transparent)}
.fix .n{direction:ltr;text-align:left;color:var(--ok);font-weight:700}
.fix .y{font-size:12.5px;color:var(--mu)}
.wordpick{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.wordpick label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:12px;background:var(--in);cursor:pointer}
.wordpick input{width:20px;height:20px;flex:0 0 20px;margin-top:3px;accent-color:var(--ac2)}
.wordpick .w{font-weight:800;direction:ltr;display:inline-block}
audio{width:100%;margin-top:8px}

/* progress */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vs .col{margin:0;padding:12px}
.vs .col h3{font-size:14px}
.vs .k{display:flex;justify-content:space-between;gap:6px;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--bd)}
.vs .k:last-child{border-bottom:0}
.vs .k b{font-weight:800}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--bd)} .chart .ln{fill:none;stroke:var(--ac2);stroke-width:2.5} .chart .ln2{fill:none;stroke:var(--ac);stroke-width:2.5}
.chart .pt{fill:var(--ac2)} .chart .pt2{fill:var(--ac)} .chart .bb{fill:var(--ac)} .chart .bb.hi{fill:var(--ac2)}
.chart text{fill:var(--mu);font-family:var(--font);font-size:9px}
.hm{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.hm i{aspect-ratio:1;border-radius:6px;background:var(--in);display:block;max-width:100%}
.hm i.p{background:color-mix(in srgb,var(--ac) 45%,transparent)} .hm i.f{background:var(--ok)} .hm i.t{outline:2px solid var(--warn)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bdg{text-align:center;padding:10px 6px;margin:0;opacity:.5}
.bdg.on{opacity:1;border-color:color-mix(in srgb,var(--warn) 55%,transparent)}
.bdg .e{font-size:28px;line-height:1.3;filter:grayscale(1)} .bdg.on .e{filter:none}
.bdg b{display:block;font-size:12.5px} .bdg span{font-size:11px;color:var(--mu);line-height:1.5;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-left:5px}

/* tab bar + sheet */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
#tabs nav{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px;border-radius:22px;background:linear-gradient(135deg,var(--g1),var(--g2));border:1px solid var(--bd);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 8px 30px rgba(0,0,0,.25)}
#tabs button{font:inherit;font-size:11.5px;background:none;border:0;color:var(--mu);padding:4px 0;border-radius:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.4;position:relative}
#tabs button span.e{font-size:21px}
#tabs button[aria-selected="true"]{color:var(--tx);background:var(--in);font-weight:700}
#tabs .dotn{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:99px;background:var(--bad);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 5px}
#ov{position:fixed;inset:0;z-index:30;background:rgba(5,6,20,.55);display:flex;align-items:flex-end;justify-content:center}
#sheet{width:100%;max-width:640px;max-height:92%;overflow-y:auto;background:var(--sheet);color:var(--tx);border-radius:26px 26px 0 0;border:1px solid var(--bd);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
#sheet .grab{width:44px;height:5px;border-radius:99px;background:var(--bd);margin:2px auto 10px}
#sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
#sheet .glass{backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}
.thinking{display:flex;align-items:center;gap:10px;color:var(--mu)}
.thinking::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--ac2);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--sheet);color:var(--tx);border:1px solid var(--bd);padding:10px 18px;border-radius:99px;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
#fx{position:fixed;inset:0;pointer-events:none;z-index:45;width:100%;height:100%}
.empty{text-align:center;color:var(--mu);padding:18px 8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8E7CFF"></stop><stop offset="1" stop-color="#00D4C8"></stop></linearGradient></defs></svg>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="toast" id="toast" role="status"></div>

<div id="wrap" dir="rtl">
  <div id="top"><b>مسیر انگلیسی</b><div class="row"><span class="chip" id="syncChip">در حال اتصال…</span><button class="icon-btn" id="themeBtn" aria-label="تغییر تم">🌓</button></div></div>
  <main id="view"></main>
</div>

<div id="tabs" dir="rtl"><nav role="tablist">
  <button role="tab" data-tab="today" aria-selected="true"><span class="e">🏠</span>امروز</button>
  <button role="tab" data-tab="plan" aria-selected="false"><span class="e">🗓️</span>برنامه</button>
  <button role="tab" data-tab="words" aria-selected="false"><span class="e">🃏</span>لغت‌ها<span class="dotn" id="dueDot" hidden></span></button>
  <button role="tab" data-tab="journal" aria-selected="false"><span class="e">📒</span>کارنامه</button>
  <button role="tab" data-tab="progress" aria-selected="false"><span class="e">📈</span>پیشرفت</button>
</nav></div>

<div id="ov" hidden dir="rtl"><div id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(function(){
'use strict';
/* ====================== helpers ====================== */
const $ = (s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const fa = v => String(v).replace(/\d/g, d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clampDay = d => Math.max(1, Math.min(90, d));
const edOf = d => Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())/864e5);
const TODAY = () => edOf(new Date());
const edFromISO = s => { const [y,m,d]=s.split('-').map(Number); return Date.UTC(y,m-1,d)/864e5; };
const isoFromEd = e => new Date(e*864e5).toISOString().slice(0,10);
const jalali = (e, opt) => { try{ return new Date(e*864e5+12*36e5).toLocaleDateString('fa-IR-u-ca-persian', opt||{day:'numeric',month:'long'}); }catch(_){ return isoFromEd(e); } };
const mmss = s => fa(String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'));
const countWords = t => (String(t||'').trim().match(/[A-Za-z][A-Za-z'’-]*/g)||[]).length;
let capCache = {};
async function use(name){ if(name in capCache) return capCache[name]; try{ capCache[name] = (window.claude && window.claude.use) ? await window.claude.use(name) : null; }catch(_){ capCache[name]=null; } return capCache[name]; }

/* ====================== plan content ====================== */
const BBC6 = 'https://www.bbc.co.uk/learningenglish/english/features/6-minute-english';
const PHASES = [
  {n:'پایه', en:'Foundation', from:1, to:30, words:5, write:'۵ جمله', wmin:40, speak:'۱ دقیقه', listen:'یک قسمت 6 Minute English را گوش بده. یک بار بدون متن، بعد با متن.'},
  {n:'گسترش', en:'Expansion', from:31, to:60, words:7, write:'۸ جمله', wmin:80, speak:'۹۰ ثانیه', listen:'یک قسمت 6 Minute English: اول بدون متن خلاصه بنویس، بعد با متن چک کن.'},
  {n:'روانی', en:'Fluency', from:61, to:90, words:10, write:'۱۲۰ کلمه', wmin:120, speak:'۲ دقیقه', listen:'6 Minute English یا یک پادکست دلخواه. بعد از گوش دادن، با صدای بلند خلاصه‌اش را بگو.'}
];
const phaseOf = d => PHASES[d<=30?0:d<=60?1:2];
const CHECKIN_DAYS = [1,30,60,90];
const CHECKIN = 'Introduce yourself: who you are, what you do every day, and why you are learning English. What are your goals?';
const TOPICS = [

const isRest = d => d%7===0 && !CHECKIN_DAYS.includes(d);

function tasksFor(d){
  const p = phaseOf(d), ck = CHECKIN_DAYS.includes(d), T = [];
  if(d===1) T.push({id:'words', ic:'➕', t:'لغت‌نامه‌ات را بساز', h:'حداقل ۵ لغت اضافه کن، یا بسته‌ی آماده‌ی ۶۰ لغت پرکاربرد را با یک دکمه اضافه کن.', act:'starter'});
  else T.push({id:'review', ic:'⏱️', t:'۱۰ دقیقه مرور لغت‌ها', h:'تایمر هنگام مرور کارت‌ها خودش می‌شمارد. سر ۱۰ دقیقه، این کار خودکار تیک می‌خورد.', act:'review'});
  if(isRest(d)){
    T.push({id:'listen', ic:'🎧', t:'گوش دادن آزاد', h:'هر چیزی که دوست داری: یک قسمت 6 Minute English، پادکست یا سکانسی از یک فیلم. بنویس چه گوش دادی.', act:'listen'});
    T.push({id:'report', ic:'🧭', t:'گزارش هفته', h:'Claude کارهای این هفته‌ات را می‌خواند و نقاط قوت و چیزهایی را که باید تمرین کنی می‌گوید.', act:'report'});
    return T;
  }
  T.push({id:'listen', ic:'🎧', t:'گوش دادن: 6 Minute English', h:p.listen+' بعد بنویس چه گوش دادی و چه لغاتی یاد گرفتی.', act:'listen'});
  if(d!==1) T.push({id:'words', ic:'➕', t:'حداقل '+fa(p.words)+' لغت جدید اضافه کن', h:'از چیزی که گوش دادی یا خواندی. Claude می‌تواند لغات را از متن برایت دربیاورد.', act:'addword'});
  T.push({id:'speak', ic:'🎙️', t:(ck?'آزمون صحبت: ':'صحبت کن: ')+p.speak, h:ck?'همین موضوع در روزهای ۱، ۳۰، ۶۰ و ۹۰ تکرار می‌شود تا پیشرفتت را بشنوی.':'صدایت را ضبط کن. اگر متنش را هم بنویسی، Claude اشتباه‌هایت را می‌گوید.', act:'speak', prompt:topicOf(d), ck});
  T.push({id:'write', ic:'✍️', t:(ck?'آزمون نوشتن: ':'بنویس: ')+p.write, h:ck?'با روز اولت مقایسه می‌شود.':'Claude متنت را تصحیح می‌کند: نسخه‌ی اصلی و درست را کنار هم می‌بینی.', act:'write', prompt:topicOf(d), ck});
  return T;
}

const LS='masir-english-v1';
const S = { meta:{start:isoFromEd(TODAY()), time:'20:00', manual:{}, timer:{}, compare:null, made:Date.now()}, entries:{}, words:{} };
try{ const r=JSON.parse(localStorage.getItem(LS)||'null'); if(r && r.meta){ Object.assign(S.meta, r.meta); S.entries=r.entries||{}; S.words=r.words||{}; } }catch(_){}

/* ====================== storage ====================== */
let REF=null, metaT=null;
const inflight=new Set(), dirty=new Set();
function writeLocal(){ try{ localStorage.setItem(LS, JSON.stringify({meta:S.meta, entries:S.entries, words:S.words})); }catch(_){} }
function setSync(t, ok){ const c=$('#syncChip'); c.textContent=t; c.className='chip '+(ok?'ok':'warn'); }
function saveMeta(){ writeLocal(); if(!REF) return; clearTimeout(metaT); metaT=setTimeout(async()=>{ try{ await REF.meta.set(JSON.parse(JSON.stringify(S.meta))); setSync('ذخیره شد ✓',true); }catch(e){ setSync('ذخیره‌ی آنلاین نشد',false); } }, 800); }
function put(kind, id){ writeLocal(); flush(kind, id); }
function drop(kind, id){ delete S[kind][id]; writeLocal(); flush(kind, id); }
async function flush(kind, id){
  if(!REF) return; const key=kind+'/'+id;
  if(inflight.has(key)){ dirty.add(key); return; }
  inflight.add(key);
  try{ const ref=REF[kind].doc(id); if(S[kind][id]) await ref.set(JSON.parse(JSON.stringify(S[kind][id]))); else await ref.delete(); setSync('ذخیره شد ✓',true); }
  catch(e){ setSync(e && e.code==='quota_exceeded'?'فضای ذخیره پر است':'ذخیره‌ی آنلاین نشد',false); }
  inflight.delete(key); if(dirty.delete(key)) flush(kind, id);
}
async function connect(){
  let done=false; const t=setTimeout(()=>{ if(!done) setSync('فقط روی این دستگاه',false); }, 10000);
  try{
    const [db, user] = await Promise.all([use('db'), use('user')]);
    const id = user ? await user.id() : null;
    if(!db || !id){ done=true; clearTimeout(t); setSync('فقط روی این دستگاه',false); return; }
    const base='data/users/'+id+'/masir-english';
    const R={meta:db.doc(base), entries:db.collection(base+'/entries'), words:db.collection(base+'/words')};
    const [m, es, ws] = await Promise.all([R.meta.get(), R.entries.get(), R.words.get()]);
    done=true; clearTimeout(t); REF=R;
    if(m.exists){
      Object.assign(S.meta, m.data()||{});
      S.entries={}; es.docs.forEach(d=>S.entries[d.id]=d.data()); S.words={}; ws.docs.forEach(d=>S.words[d.id]=d.data());
      writeLocal();
    } else {
      saveMeta();
      for(const k of Object.keys(S.entries)) await flush('entries',k);
      for(const k of Object.keys(S.words)) await flush('words',k);
    }
    setSync('همگام با حساب ✓',true); badgeSeen=null; render();
  }catch(e){ done=true; clearTimeout(t); setSync('فقط روی این دستگاه',false); }
}

/* ====================== derived ====================== */
const entriesOf = (type, d) => Object.values(S.entries).filter(e=>(!type||e.type===type) && (d==null||e.day===d)).sort((a,b)=>a.at-b.at);
const wordsOfDay = d => Object.values(S.words).filter(w=>w.day===d);
function autoDone(d, task){
  switch(task.id){
    case 'review': return (S.meta.timer[d]||0) >= 600;
    case 'listen': return entriesOf('listen', d).length>0;
    case 'words': return wordsOfDay(d).length >= (d===1?5:phaseOf(d).words);
    case 'speak': return entriesOf('speak', d).length>0;
    case 'write': return entriesOf('write', d).length>0;
    case 'report': return entriesOf('report', d).length>0;
  }
  return false;
}
const isDone = (d, task) => autoDone(d,task) || !!(S.meta.manual[d] && S.meta.manual[d][task.id]);
const dayCount = d => { const ts=tasksFor(d); return {done:ts.filter(t=>isDone(d,t)).length, total:ts.length}; };
const isFull = d => { const c=dayCount(d); return c.done===c.total; };
function stats(){
  const now=planDay(); let full=0, tdone=0, ttot=0, best=0, run=0;
  for(let d=1; d<=90; d++){ const c=dayCount(d); tdone+=c.done; ttot+=c.total; if(c.done===c.total){ full++; run++; best=Math.max(best,run);} else run=0; }
  let streak=0, d=clampDay(now); if(now>=1 && !isFull(d)) d--; while(now>=1 && d>=1 && isFull(d)){ streak++; d--; }
  const W=Object.values(S.words); const learned=W.filter(w=>w.st==='review'&&w.ivl>=7).length;
  const minutes=Math.round(Object.values(S.meta.timer).reduce((a,b)=>a+b,0)/60);
  return {now, full, pct:Math.round(tdone/ttot*100), best, streak, words:W.length, learned, minutes,
    listens:entriesOf('listen').length, writes:entriesOf('write').length, speaks:entriesOf('speak').length, files:entriesOf('file').length};
}

/* ====================== SRS ====================== */
const dueWords = () => Object.values(S.words).filter(w=>w.due<=TODAY()).sort((a,b)=>a.due-b.due);
function nextIvl(w,g){ const i=w.ivl||1; if(g===2) return Math.max(i+1,Math.round(i*1.2)); if(g===3) return Math.max(i+1,Math.round(i*w.ease)); return Math.max(i+2,Math.round(i*w.ease*1.3)); }
function preview(w,g){ if(w.st!=='review') return g===1?'الان':g===2?'کمی بعد':g===3?'۱ روز':'۴ روز'; return g===1?'الان':fa(nextIvl(w,g))+' روز'; }
function grade(w,g){
  const t=TODAY(); w.reps=(w.reps||0)+1; let again=false;
  if(w.st!=='review'){ if(g<=2){ w.st='learn'; w.due=t; again=true; } else { w.st='review'; w.ivl=g===4?4:1; w.due=t+w.ivl; } }
  else if(g===1){ w.lapses=(w.lapses||0)+1; w.ease=Math.max(1.3,w.ease-0.2); w.ivl=1; w.st='learn'; w.due=t; again=true; }
  else { if(g===2) w.ease=Math.max(1.3,w.ease-0.15); if(g===4) w.ease+=0.15; w.ivl=nextIvl(w,g); w.due=t+w.ivl; }
  put('words', w.id); return again;
}
function addWord(f,b,ex,src,day){
  f=String(f||'').trim(); if(!f) return null;
  if(Object.values(S.words).some(w=>w.f.toLowerCase()===f.toLowerCase())) return null;
  const id='w'+uid();
  S.words[id]={id,f,b:String(b||'').trim()||'—',ex:String(ex||'').trim(),src:src||'',day:day||curDay(),at:Date.now(),st:'new',due:TODAY(),ivl:0,ease:2.5,reps:0,lapses:0};
  put('words', id); return S.words[id];
}

const arr = v => Array.isArray(v) ? v : [];
const str = v => typeof v==='string' ? v : (v==null?'':String(v));
const cleanWords = v => arr(v).filter(x=>x && (x.w||x.word)).slice(0,15).map(x=>({w:str(x.w||x.word).slice(0,80), m:str(x.m||x.meaning).slice(0,120), ex:str(x.ex||x.example).slice(0,200)}));

function lineChart(list){
  const W=320,H=140,L=24,B=118,T=10; const maxD=Math.max(10,...list.map(e=>e.day));
  const x=d=>L+(d-1)/(Math.max(1,maxD-1))*(W-L-10), y=v=>B-(v/100)*(B-T);
  let g=''; [0,50,100].forEach(v=>{ g+='<line class="grid" x1="'+L+'" x2="'+(W-6)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(L-4)+'" y="'+(y(v)+3)+'" text-anchor="end">'+fa(v)+'</text>'; });
  [1,Math.round(maxD/2),maxD].forEach(d=>{ g+='<text x="'+x(d).toFixed(1)+'" y="'+(B+14)+'" text-anchor="middle">روز '+fa(d)+'</text>'; });
  ['write','speak'].forEach((t,i)=>{ const pts=list.filter(e=>e.type===t).map(e=>[x(e.day),y(Math.max(0,Math.min(100,Number(e.fb.score)||0)))]);
    if(pts.length>1) g+='<polyline class="'+(i?'ln2':'ln')+'" points="'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'"/>';
    pts.forEach(p=>{ g+='<circle class="'+(i?'pt2':'pt')+'" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.5"/>'; }); });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="نمودار امتیازها" style="direction:ltr">'+g+'</svg>';
}
function barChart(){
  const W=320,H=120,B=96,T=14, n=14, slot=W/n, bw=slot*.58, now=curDay();
  const data=Array.from({length:n},(_,i)=>{ const d=now-n+1+i; return {d, v:d>=1?Math.round((S.meta.timer[d]||0)/60):0}; });
  const max=Math.max(10,...data.map(x=>x.v)); let g='<line class="grid" x1="0" x2="'+W+'" y1="'+B+'" y2="'+B+'"/>';
  data.forEach((x,i)=>{ const cx=W-slot*(i+.5), bh=x.v?Math.max(2,x.v/max*(B-T)):0;
    g+='<rect class="bb'+(x.d===now?' hi':'')+'" x="'+(cx-bw/2).toFixed(1)+'" y="'+(B-bh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="3"/>';
    if(x.v) g+='<text x="'+cx.toFixed(1)+'" y="'+(B-bh-3).toFixed(1)+'" text-anchor="middle">'+fa(x.v)+'</text>';
    if(x.d>=1) g+='<text x="'+cx.toFixed(1)+'" y="'+(B+14)+'" text-anchor="middle">'+fa(x.d)+'</text>'; });

let rv=null, tickI=null, lastAct=0;
function openReview(){
  const due=dueWords();
  const all=Object.values(S.words);
  if(!all.length){ openSheet(head('مرور لغت‌ها')+'<div class="empty">هنوز لغتی نداری. اول چند لغت اضافه کن یا بسته‌ی آماده را بگیر.</div><div class="row" style="justify-content:center"><button class="btn" data-act="starterpack">📦 بسته‌ی ۶۰ لغت آماده</button><button class="btn sec2" data-act="addword">➕ افزودن لغت</button></div>'); return; }
  rv={queue:due.map(w=>w.id), cram:false, shown:false, done:0, ok:0};
  if(!rv.queue.length) startCram();
  lastAct=Date.now();
  openSheet('<div id="rvBox"></div>', ()=>{ renderReview(); }, ()=>{ clearInterval(tickI); tickI=null; rv=null; saveMeta(); });
  clearInterval(tickI);
  tickI=setInterval(()=>{
    if(!rv || document.visibilityState!=='visible' || Date.now()-lastAct>90000) return;
    const d=curDay(); if(planDay()<1) return;
    const before=S.meta.timer[d]||0; S.meta.timer[d]=before+1;
    if(before<600 && before+1>=600){ toast('⏱️ ۱۰ دقیقه مرور کامل شد! تیک خورد ✓'); celebrate(); }
    const c=$('#rvClock'); if(c) c.textContent=mmss(Math.min(S.meta.timer[d],600))+(S.meta.timer[d]>=600?' ✓':'');
    if((S.meta.timer[d])%15===0) saveMeta();
  },1000);
}
function startCram(){ const all=Object.values(S.words).map(w=>w.id); for(let i=all.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; } rv.queue=all; rv.cram=true; }
function renderReview(){
  const box=$('#rvBox'); if(!box||!rv) return;
  const sec=S.meta.timer[curDay()]||0;
  let h=head('مرور لغت‌ها', rv.cram?'مرور آزاد: کارت امروز تمام شده، برای تکمیل ۱۰ دقیقه همه‌ی لغت‌ها را تمرین کن (زمان‌بندی تغییر نمی‌کند).':'کارت‌های امروز')+
    '<div class="glass timerbox"><div><span class="mu sm">تایمر امروز</span><div class="clock" id="rvClock">'+mmss(Math.min(sec,600))+(sec>=600?' ✓':'')+'</div></div><div class="mu sm">'+fa(rv.done)+' کارت مرور شد · '+fa(rv.queue.length)+' مانده</div></div>';
  if(!rv.queue.length){
    h+='<div class="glass c"><h2>آفرین! 🎉</h2><p class="mu">کارت‌های امروز تمام شد'+(sec<600?'. برای کامل شدن ۱۰ دقیقه، مرور آزاد را ادامه بده.':'.')+'</p><div class="row" style="justify-content:center;margin-top:10px"><button class="btn" data-act="cram">ادامه با مرور آزاد</button><button class="btn sec2" data-act="close">بستن</button></div></div>';
    box.innerHTML=h; return;
  }
  const w=S.words[rv.queue[0]]; if(!w){ rv.queue.shift(); return renderReview(); }
  h+='<div class="glass flash" data-act="reveal" role="button" tabindex="0" aria-label="نمایش معنی"><span class="chip">'+(w.st==='new'?'جدید':w.st==='learn'?'در حال یادگیری':'مرور')+'</span><div class="front">'+esc(w.f)+'</div>'+
    (rv.shown?'<div class="back">'+esc(w.b)+'</div>'+(w.ex?'<div class="ex">'+esc(w.ex)+'</div>':'')+(w.src?'<span class="mu sm">منبع: '+esc(w.src)+'</span>':''):'<span class="mu sm">بزن تا معنی را ببینی</span>')+'</div>'+
    '<div class="row" style="justify-content:center;margin-bottom:10px"><button class="btn sec2 sm" data-act="say" data-w="'+w.id+'">🔊 تلفظ</button>'+(rv.shown?'':'<button class="btn sm" data-act="reveal">نمایش معنی</button>')+'</div>';
  if(rv.shown) h+='<div class="grades">'+[1,2,3,4].map(g=>'<button class="grade g'+g+'" data-act="grade" data-g="'+g+'"><b>'+['دوباره','سخت','خوب','آسان'][g-1]+'</b><span>'+(rv.cram?'—':preview(w,g))+'</span></button>').join('')+'</div>';
  box.innerHTML=h;
}
function doGrade(g){
  if(!rv||!rv.shown||!rv.queue.length) return; lastAct=Date.now();
  const id=rv.queue.shift(), w=S.words[id]; rv.done++; if(g>=3) rv.ok++;
  if(rv.cram){ if(g===1) rv.queue.splice(Math.min(4,rv.queue.length),0,id); }
  else if(grade(w,g)) rv.queue.splice(Math.min(g===1?3:5,rv.queue.length),0,id);
  rv.shown=false; renderReview();
}

async function startRec(){
  const btn=$('#recBtn');
  if(rec){ stopRec(); return; }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const type=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
    const mr=new MediaRecorder(stream, type?{mimeType:type}:undefined); const chunks=[]; const t0=Date.now();
    mr.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
    mr.onstop=()=>{ stream.getTracks().forEach(t=>t.stop()); if(rec&&rec.discard){ rec=null; return; } rec=null; const b=new Blob(chunks,{type:mr.mimeType||'audio/webm'}); setRecording(b,'ضبط '+fa(Math.round((Date.now()-t0)/1000))+' ثانیه'); if(btn){ btn.textContent='⏺️ ضبط دوباره'; } };
    mr.start(); rec={mr, t0};
    btn.textContent='⏹️ توقف ضبط'; $('#recNote').textContent='در حال ضبط… صحبت کن.';
    rec.iv=setInterval(()=>{ if(!rec) return; const s=Math.round((Date.now()-rec.t0)/1000); $('#recNote').textContent='در حال ضبط… '+mmss(s); if(s>=300) stopRec(); },500);
  }catch(e){ $('#recNote').innerHTML='ضبط داخل برنامه در این نمایش اجازه ندارد. دکمه‌ی <b>«ضبط با گوشی»</b> را بزن: ضبط‌کننده‌ی صدای گوشی باز می‌شود و فایل اینجا برمی‌گردد.'; }
}
function stopRec(discard){ if(!rec) return; clearInterval(rec.iv); if(discard) rec.discard=true; try{ rec.mr.stop(); }catch(_){ rec=null; } }
async function toStorable(blob){
  const t=(blob.type||'').toLowerCase(), n=(blob.name||'').toLowerCase();
  if(t.includes('webm')||n.endsWith('.webm')) return new Blob([blob],{type:'video/webm'});
  if(t.includes('mp4')||t.includes('m4a')||t.includes('aac')&&n.endsWith('.m4a')||n.endsWith('.m4a')||n.endsWith('.mp4')) return new Blob([blob],{type:'video/mp4'});
  // other formats (mp3, wav, ogg, 3gp…): decode and re-record as webm, in real time
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC||!window.MediaRecorder) throw new Error('no-transcode');
  const ctx=new AC(); const buf=await ctx.decodeAudioData(await blob.arrayBuffer());
  if(buf.duration>300) throw new Error('too-long');
  const dest=ctx.createMediaStreamDestination(), src=ctx.createBufferSource(); src.buffer=buf; src.connect(dest);
  const mr=new MediaRecorder(dest.stream); const chunks=[];
  return await new Promise((res,rej)=>{ mr.ondataavailable=e=>e.data.size&&chunks.push(e.data); mr.onstop=()=>{ ctx.close(); res(new Blob(chunks,{type:'video/webm'})); }; mr.onerror=rej; src.onended=()=>mr.stop(); mr.start(); src.start(); });
}

async function shrinkImage(f){
  const url=URL.createObjectURL(f); const img=new Image(); await new Promise((r,j)=>{ img.onload=r; img.onerror=j; img.src=url; });
  const k=Math.min(1,1600/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
  return await new Promise(r=>c.toBlob(r,'image/jpeg',.85));
}
let pdfLoading=null;
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function readTextFile(f){
  if(/pdf/i.test(f.type)||/\.pdf$/i.test(f.name)){
    const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    if(!pdfLoading) pdfLoading=loadScript(base+'pdf.min.js').then(()=>loadScript(base+'pdf.worker.min.js'));
    await pdfLoading; const lib=window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js';
    const doc=await lib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise; let out='';
    for(let i=1;i<=Math.min(doc.numPages,40);i++){ const pg=await doc.getPage(i); const tc=await pg.getTextContent(); out+=tc.items.map(x=>x.str).join(' ')+'\n'; if(out.length>60000) break; }
    return out.trim();
  }
  let t=await f.text();
  if(/\.(srt|vtt)$/i.test(f.name)) t=t.replace(/^WEBVTT.*$/m,'').replace(/^\d+\s*$/gm,'').replace(/^[\d:.,]+\s*-->.*$/gm,'').replace(/<[^>]+>/g,'').replace(/\n{2,}/g,'\n');
  return t.trim();
}

    case 'reset': $('#resetBox').hidden=false; break;
    case 'resetno': $('#resetBox').hidden=true; break;
    case 'resetyes': { const es=Object.keys(S.entries), ws=Object.keys(S.words); S.entries={}; S.words={}; S.meta.manual={}; S.meta.timer={}; S.meta.compare=null; es.forEach(k=>flush('entries',k)); ws.forEach(k=>flush('words',k)); saveMeta(); badgeSeen=null; toast('همه چیز پاک شد.'); render(); break; }
  }
});
document.addEventListener('input', e=>{ if(e.target.id==='wsearch'){ wSearch=e.target.value; const pos=e.target.selectionStart; render(); const s=$('#wsearch'); if(s){ s.focus(); try{ s.setSelectionRange(pos,pos); }catch(_){} } } });
document.addEventListener('change', e=>{
  if(e.target.id==='setStart' && e.target.value){ S.meta.start=e.target.value; selDay=null; saveMeta(); render(); }
  if(e.target.id==='setTime' && e.target.value){ S.meta.time=e.target.value; saveMeta(); render(); }
});
document.addEventListener('keydown', e=>{
  if(!rv || $('#ov').hidden || e.target.matches('input,textarea')) return;
  if((e.code==='Space'||e.key==='Enter') && !rv.shown){ e.preventDefault(); rv.shown=true; lastAct=Date.now(); renderReview(); }
  else if(rv.shown && ['1','2','3','4'].includes(e.key)) doGrade(Number(e.key));
});
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{ lastAct=Date.now(); },{passive:true}));

/* theme */
function applyTheme(t){ if(t) document.documentElement.setAttribute('data-theme',t); else document.documentElement.removeAttribute('data-theme'); }
try{ const t=localStorage.getItem('masir-theme'); if(t) applyTheme(t); }catch(_){}
$('#themeBtn').onclick=()=>{ const cur=document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'); const nt=cur==='light'?'dark':'light'; applyTheme(nt); try{ localStorage.setItem('masir-theme',nt); }catch(_){} };

/* effects */
let toastT; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }
function celebrate(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=$('#fx'), x=c.getContext('2d'), r=devicePixelRatio||1; c.width=innerWidth*r; c.height=innerHeight*r; x.setTransform(r,0,0,r,0,0);
  const cols=['#8E7CFF','#00D4C8','#FF6FB5','#FFC857','#5CFFB0'];
  const P=Array.from({length:120},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*13,vy:Math.random()*-12-3,s:Math.random()*7+4,c:cols[Math.floor(Math.random()*5)],a:Math.random()*6,va:(Math.random()-.5)*.3}));
  let f=0;(function tk(){ x.clearRect(0,0,innerWidth,innerHeight); P.forEach(p=>{ p.vy+=.35; p.x+=p.vx; p.y+=p.vy; p.vx*=.99; p.a+=p.va; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); x.restore(); }); if(++f<110) requestAnimationFrame(tk); else x.clearRect(0,0,innerWidth,innerHeight); })();
}

render();
connect();
})();
</script>
